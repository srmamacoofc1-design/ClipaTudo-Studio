name: Verificar ClipaTudo Studio
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:skill
      - run: npm run prepare:vision
      - run: node scripts/check-clipatudo-distribution.mjs
      - run: node --import tsx --test tests/framing.test.mjs tests/composition-follow.test.mjs
      - run: npm run typecheck
      - run: npm run helper:build
